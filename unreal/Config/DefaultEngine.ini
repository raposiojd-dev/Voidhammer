; Voidhammer: The Shattered Realms - engine config.
; LOW-SPEC MODE is the default (John's PC: Windows, modest GPU). See design/VERTICAL_SLICE_GDD_v1.md 10.10a.
; To switch to the FULL LOOK (strong GPU or cloud workstation, M7): comment out the LOW-SPEC block in
; [/Script/Engine.RendererSettings] and uncomment the FULL LOOK block. Expect one long shader recompile.

[/Script/EngineSettings.GameMapsSettings]
; Small basic engine map: safe on weak GPUs. Replace with Content/Maps/L_Sandbox once it exists.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/VoidhammerSR.VHGameMode

[/Script/Engine.RendererSettings]
; ---- LOW-SPEC (default) ----
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.AllowStaticLighting=True
r.GenerateMeshDistanceFields=False
r.SkinCache.CompileShaders=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.Nanite.ProjectEnabled=True
; Forward shading is cheaper still but rules out Lumen. Only if Deferred at Low is under ~20 fps:
; r.ForwardShading=True

; ---- FULL LOOK (M7 / strong or cloud GPU) ----
; r.DynamicGlobalIlluminationMethod=1
; r.ReflectionMethod=1
; r.Shadow.Virtual.Enable=1
; r.GenerateMeshDistanceFields=True
; r.AllowStaticLighting=False
; r.DefaultFeature.MotionBlur=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Old or integrated GPU crashing on DX12? Launch the editor with -dx11 (see README), or set:
; DefaultGraphicsRHI=DefaultGraphicsRHI_DX11

[Core.Log]
LogVoidhammer=Log
